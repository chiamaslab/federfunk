[platformio]
default_envs = esp32-s3-13in3e6-hardware-test
core_dir = .pio/core
build_dir = .pio/hardware-test
src_dir = tests/hardware

# Offline, one-refresh test for the integrated WROOM-2-N32R16V board.
# Keep these memory/toolchain settings aligned with the production large profile.
[env:esp32-s3-13in3e6-hardware-test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_upload.flash_size = 32MB
board_upload.maximum_size = 4194304
board_build.flash_mode = opi
board_build.arduino.memory_type = opi_opi
board_build.partitions = partitions_32mb.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3

# Same app and production driver, replacing only the SPI byte transport.
[env:esp32-s3-13in3e6-bitbang-test]
extends = env:esp32-s3-13in3e6-hardware-test
lib_ignore = SPI
build_flags =
    ${env:esp32-s3-13in3e6-hardware-test.build_flags}
    -D BIRDDISPLAY_SOFTWARE_SPI=1
    -I tests/hardware-bitbang

# Isolate the longer power-on settling time used by other board examples.
[env:esp32-s3-13in3e6-settle-test]
extends = env:esp32-s3-13in3e6-hardware-test
build_flags =
    ${env:esp32-s3-13in3e6-hardware-test.build_flags}
    -D BIRDDISPLAY_POWER_SETTLE_TEST=1
